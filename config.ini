; 用户配置。修改后从托盘选择“重新加载”。
; profile 可从托盘状态或 tools\ime-probe.ahk 的输出中复制。

[general]
enabled=1
defaultState=wetype-chinese
foregroundSettleMs=80
activePollMs=250
idlePollMs=1000
burstDurationMs=2000
applySuppressMs=1000
saveDebounceMs=2000
messageTimeoutMs=120
logLevel=info

[identity]
windowModeExe=msedge.exe,chrome.exe,firefox.exe,explorer.exe,zettlr.exe
ignoreExe=autohotkey64.exe,autohotkey32.exe,textinputhost.exe,searchhost.exe,startmenuexperiencehost.exe
ignoreClassRegex=i)^(Progman|WorkerW|Shell_(Secondary)?TrayWnd|TopLevelWindowForOverflowXamlIsland|NotifyIconOverflowWindow|XamlExplorerHostIslandWindow|tooltips_class32|IME)$

[typing]
backtickInChinese=0

[state.english-us]
profile=0409:00000409
imeOpen=unknown
conversion=preserve
sentence=preserve

[state.wetype-chinese]
profile=0804:{86598FB9-66A2-463E-B9C2-AEB906D477AD}{607FDF85-FCC8-4DBD-A365-41296F980C9C}
imeOpen=1
conversion=preserve
sentence=preserve

[state.wetype-english]
profile=0804:{86598FB9-66A2-463E-B9C2-AEB906D477AD}{607FDF85-FCC8-4DBD-A365-41296F980C9C}
imeOpen=0
conversion=preserve
sentence=preserve

[rule.windows-terminal]
enabled=1
priority=100
exe=WindowsTerminal.exe
state=english-us

[rule.classic-powershell]
enabled=1
priority=100
exe=powershell.exe
state=english-us

[rule.raycast]
enabled=1
priority=100
exe=Raycast.exe
state=english-us
